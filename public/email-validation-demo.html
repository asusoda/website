<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASU Email Validation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            max-width: 28rem;
            text-align: center;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.5rem;
            color: #f87171;
        }
        h1 {
            font-size: 1.875rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .description {
            color: #d1d5db;
            margin-bottom: 1rem;
        }
        .email-box {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        .email-label {
            font-size: 0.875rem;
            color: #9ca3af;
            margin-bottom: 0.5rem;
        }
        .email-address {
            font-family: monospace;
            font-size: 0.875rem;
            word-break: break-all;
        }
        .warning {
            color: #fbbf24;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .instruction {
            font-size: 0.875rem;
            color: #6b7280;
        }
        .highlight {
            color: #60a5fa;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <circle cx="12" cy="12" r="10" stroke-width="2"/>
            <line x1="12" y1="8" x2="12" y2="12" stroke-width="2"/>
            <line x1="12" y1="16" x2="12.01" y2="16" stroke-width="2"/>
        </svg>
        
        <h1>Access Restricted</h1>
        <p class="description">
            The SoDA Shop is only available to ASU students and members.
        </p>
        
        <div class="email-box">
            <p class="email-label">You are currently signed in with:</p>
            <p class="email-address">user@gmail.com</p>
        </div>
        
        <p class="warning">Please sign up with your ASURITE email</p>
        <p class="instruction">
            Your ASURITE email ends with <span class="highlight">@asu.edu</span>
        </p>
    </div>
</body>
</html>
